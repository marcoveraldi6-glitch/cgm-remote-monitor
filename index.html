<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FitTrack</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--ac:#0a84ff;--ok:#22a06b;--bad:#e5484d;--bd:#e3e6eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2a2f3a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{padding:14px 14px 100px;max-width:560px;margin:0 auto}
.card,.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid .k{margin:0;display:flex;flex-direction:column}.wide{grid-column:span 2}
.k span,.mut{color:var(--mut);font-size:13px}.k b{font-size:22px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;min-width:0}
input,select,textarea{width:100%}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{font-size:12px;color:var(--mut);display:block}
ul{list-style:none;padding:0;margin:0}
li{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}li div{flex:1}
.x{padding:2px 10px;color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:7px 4px 8px;color:var(--mut);font-size:12px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:700}
.pb{height:8px;background:var(--bd);border-radius:5px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
svg{width:100%;height:auto}.t{fill:var(--mut);font-size:10px}
h3{margin:14px 0 6px;font-size:15px}.pos{color:var(--ac)}.neg{color:var(--ok)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
summary{cursor:pointer;padding:2px 0}details>summary b{font-size:16px}
#rt{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:5}
#rt[hidden]{display:none}#rt b{flex:1;font-size:20px}#rt button{background:#fff3;color:#fff;border-color:#fff4;padding:6px 10px}
</style></head><body>
<div id="sync" class="mut" style="text-align:center;font-size:11px;padding-top:8px"></div>
<main id="view"></main>
<nav>
<button data-t="oggi" onclick="tab='oggi';render()"><span style="display:block;font-size:19px">🏠</span>Oggi</button>
<button data-t="sch" onclick="tab='sch';render()"><span style="display:block;font-size:19px">📋</span>Schede</button>
<button data-t="alle" onclick="tab='alle';render()"><span style="display:block;font-size:19px">✏️</span>Registra</button>
<button data-t="trend" onclick="tab='trend';render()"><span style="display:block;font-size:19px">📈</span>Progressi</button>
</nav>
<div id="rt" hidden></div>
<div id="sc" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;padding:16px;flex-direction:column;gap:12px"><div style="color:#fff;text-align:center">Inquadra il codice a barre del prodotto</div><div id="rd" style="width:100%;max-width:420px;margin:auto"></div><button class="p" onclick="scanStop()">Chiudi</button></div>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const K="fittrack.v1";
let S={profile:{sex:"M",age:30,h:175,w:75,act:1.2},phases:[],exercises:["Panca piana","Squat","Stacco","Military press","Trazioni","Rematore","Corsa"],meals:[],work:[],weights:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}persist()};
const $=id=>document.getElementById(id);
const num=id=>parseFloat($(id).value)||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const R=Math.round,sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
let day=iso(new Date()),tab="oggi",exSel="",trEx="",rng=30;
const curW=()=>{const w=[...S.weights].sort((a,b)=>a.date<b.date?1:-1)[0];return w?w.kg:S.profile.w};
const bmr=()=>{const p=S.profile;return 10*curW()+6.25*p.h-5*p.age+(p.sex==="M"?5:-161)};
const phaseOn=d=>S.phases.filter(p=>p.start<=d).sort((a,b)=>a.start<b.start?1:-1)[0];
function stats(d){const m=S.meals.filter(x=>x.date===d),w=S.work.filter(x=>x.date===d);
 const intake=sum(m,"kcal"),burned=sum(w,"kcal"),base=bmr()*S.profile.act;
 return {m,w,intake,burned,base,bal:intake-base-burned,p:sum(m,"p"),c:sum(m,"c"),f:sum(m,"f")}}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function go(n){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);day=iso(d);render()}
const dateBar=()=>`<div class="row"><button onclick="go(-1)">‹</button><input type="date" value="${day}" onchange="day=this.value||day;render()"><button onclick="go(1)">›</button></div>`;

/* ---------- grafici ---------- */
const COL=["#0a84ff","#e5484d","#22a06b","#f5a623"];
const fd=d=>d.slice(8)+"/"+d.slice(5,7);
function bands(dates,X,H,t,b){const pid=dates.map(d=>{const p=phaseOn(d);return p?S.phases.indexOf(p):-1});let o="",i=0;const h=dates.length>1?(X(1)-X(0))/2:0;
 while(i<dates.length){let j=i;while(j+1<dates.length&&pid[j+1]===pid[i])j++;
  if(pid[i]>=0){const x1=X(i)-(i?h:0),x2=X(j)+(j<dates.length-1?h:0);
   o+=`<rect x="${x1}" y="${t}" width="${x2-x1}" height="${H-t-b}" fill="${COL[pid[i]%4]}" opacity=".12"/><text class="t" x="${x1+3}" y="${t+9}">${esc(S.phases[pid[i]].name)}</text>`}
  i=j+1}return o}
const wrap=(o,W,H,dates,X)=>`<svg viewBox="0 0 ${W} ${H}">${o}<text class="t" x="${X(0)}" y="${H-4}">${fd(dates[0])}</text><text class="t" text-anchor="end" x="${X(dates.length-1)}" y="${H-4}">${fd(dates[dates.length-1])}</text></svg>`;
function line(dates,series,cols){const W=340,H=170,l=36,r=8,t=8,b=20,n=dates.length;
 const all=series.flat().filter(v=>v!=null);if(all.length<2)return '<p class="mut">Servono almeno due dati.</p>';
 let mn=Math.min(...all),mx=Math.max(...all);if(mn===mx){mn--;mx++}const p=(mx-mn)*.1;mn-=p;mx+=p;
 const X=i=>l+i*(W-l-r)/Math.max(1,n-1),Y=v=>t+(mx-v)*(H-t-b)/(mx-mn);
 let o=bands(dates,X,H,t,b);
 for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;o+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text class="t" x="2" y="${Y(v)+3}">${v.toFixed(1)}</text>`}
 series.forEach((s,k)=>{let d="";s.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)});
  o+=`<path d="${d}" fill="none" stroke="${cols[k]}" stroke-width="${k?2.5:1.5}"/>`;
  if(!k)s.forEach((v,i)=>{if(v!=null)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${cols[0]}"/>`})});
 return wrap(o,W,H,dates,X)}
function bars(dates,vals,sign){const W=340,H=150,l=36,r=8,t=8,b=20,n=dates.length;
 const a=vals.filter(v=>v!=null);if(!a.length)return '<p class="mut">Nessun dato.</p>';
 const mx=Math.max(...a.map(Math.abs),1),mn=sign?-mx:0;
 const X=i=>l+i*(W-l-r)/Math.max(1,n-1),Y=v=>t+(mx-v)*(H-t-b)/(mx-mn),bw=Math.max(2,(W-l-r)/n*.7);
 let o=bands(dates,X,H,t,b)+`<line x1="${l}" x2="${W-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)"/><text class="t" x="2" y="${Y(mx)+3}">${R(mx)}</text><text class="t" x="2" y="${Y(sign?mn:0)+3}">${sign?R(mn):0}</text>`;
 vals.forEach((v,i)=>{if(v!=null)o+=`<rect x="${X(i)-bw/2}" y="${Math.min(Y(v),Y(0))}" width="${bw}" height="${Math.abs(Y(v)-Y(0))}" fill="${v>0?"#0a84ff":"#22a06b"}" rx="1"/>`});
 return wrap(o,W,H,dates,X)}

/* ---------- scheda con recuperi ---------- */
S.routines=S.routines||[];
let ss=null,rb={name:"",items:[]},rest=null,wl=null,ac=null,msg="";
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}};
function beep(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),600)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function tick(){const el=$("rt");if(!el)return;
 if(rest){const left=(rest.end-Date.now())/1000;if(left<=0){beep();rest=null}else{const l=$("rl");if(l)l.textContent=mmss(left)}}
 if(!rest)el.hidden=true;
 const e=$("el");if(e&&ss)e.textContent=mmss((Date.now()-ss.t0)/1000)}
setInterval(tick,250);
function startRest(s){rest={end:Date.now()+s*1000};const el=$("rt");el.innerHTML='<b>Riposo <span id="rl"></span></b><button onclick="rAdd(-15)">−15</button><button onclick="rAdd(15)">+15</button><button onclick="rest=null;tick()">Salta</button>';el.hidden=false;tick()}
function rAdd(n){if(rest)rest.end+=n*1000}
const lastOf=ex=>S.work.filter(x=>x.exercise===ex).sort((a,b)=>a.date<b.date?1:-1)[0];
function startSess(id){const r=S.routines.find(x=>x.id===id);if(!r)return;unlock();
 ss={name:r.name,t0:Date.now(),items:r.items.map(i=>({...i,done:0}))};
 try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(e){}
 render()}
function chip(i,k){const it=ss.items[i];unlock();if(k<=it.done){it.done=k-1}else{it.done=k;startRest(it.rest)}render()}
function endSess(){const dur=(Date.now()-ss.t0)/3600000,tot=ss.items.reduce((s,i)=>s+(i.act?0:i.done),0)||1,aM=ss.items.reduce((s,i)=>s+(i.act&&i.done?i.min:0),0),k=4*curW()*Math.max(0,dur-aM/60);
 const prs=ss.items.filter(i=>!i.act&&i.done>0&&i.kg>0&&maxLoad(i.ex)>0&&i.kg>maxLoad(i.ex)).map(i=>i.ex+" "+i.kg+" kg");
 ss.items.forEach(i=>{if(i.act){if(i.done)S.work.push({id:uid(),date:iso(new Date()),exercise:'Attività · '+i.sport,act:true,min:i.min,sets:0,reps:0,kg:0,kcal:actK(i.sport,i.int,i.min)});return}if(i.done>0)S.work.push({id:uid(),date:iso(new Date()),exercise:i.ex,sets:i.done,reps:i.reps,kg:i.kg,rpe:i.rpe||0,kcal:k*i.done/tot})});
 if(wl){try{wl.release()}catch(e){}wl=null}rest=null;tick();msg="Allenamento salvato: "+R(k+ss.items.filter(i=>i.act&&i.done).reduce((s,i)=>s+actK(i.sport,i.int,i.min),0))+" kcal stimate in "+R(dur*60)+" min."+(prs.length?" 🏆 Nuovi record: "+prs.join(", ")+".":"");ss=null;save();render()}
function stopSess(){ss=null;rest=null;tick();render()}
function rbAdd(){const ex=$("bx").value;if(!ex)return;rb.name=$("bn").value;rb.items.push({ex,sets:num("bs")||3,reps:num("br")||10,kg:num("bw"),rest:num("bt")||90});render()}
function rbDel(i){rb.name=$("bn").value;rb.items.splice(i,1);render()}
function rbSave(){rb.name=$("bn").value.trim();if(!rb.name||!rb.items.length)return;const ex_=rb.id&&S.routines.find(x=>x.id===rb.id);if(ex_){ex_.name=rb.name;ex_.items=rb.items}else S.routines.push({id:uid(),name:rb.name,items:rb.items,days:[]});rb={name:"",items:[]};save();render()}
function vSch(){const m=msg;msg="";
 if(ss)return `<div class="card row"><div style="flex:1"><b>${esc(ss.name)}</b><br><span class="mut">Durata <span id="el">${mmss((Date.now()-ss.t0)/1000)}</span></span></div><button class="p" onclick="endSess()">Termina</button><button class="x" onclick="stopSess()">Annulla</button></div>`+
 ss.items.map((it,i)=>{if(it.act)return actItemCard(it,i);const l=lastOf(it.ex);return `<div class="card"><b>${i+1}. ${esc(it.ex)}</b><br><span class="mut">${it.sets}×${it.reps} · riposo ${it.rest}s${l?` · ultima: ${l.sets}×${l.reps} a ${l.kg} kg`:""}</span>${sgCard(it,i)}
 <div class="f2" style="margin:8px 0"><div><label>Carico kg</label><input type="number" step="0.5" inputmode="decimal" value="${it.kg||""}" onchange="ss.items[${i}].kg=+this.value||0"></div><div><label>Ripetizioni</label><input type="number" inputmode="numeric" value="${it.reps}" onchange="ss.items[${i}].reps=+this.value||0"></div><div><label>Sforzo (6 facile · 10 massimo)</label><select onchange="ss.items[${i}].rpe=+this.value||0"><option value="0">–</option>${[6,7,8,9,10].map(v=>`<option ${it.rpe===v?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <div class="row seg" style="flex-wrap:wrap">${Array.from({length:it.sets},(_,k)=>`<button class="${k<it.done?"on":""}" style="flex:1;min-width:56px;padding:12px 0" onclick="chip(${i},${k+1})">${k+1}</button>`).join("")}</div></div>`}).join("")+'<p class="mut">Tocca il numero della serie quando l’hai finita: parte il riposo.</p>';
 return (m?`<div class="card">${m}</div>`:"")+S.routines.map(r=>`<div class="card"><b>${esc(r.name)}</b><br><span class="mut">${r.items.map(i=>i.act?esc(i.sport)+" "+i.min+" min":esc(i.ex)+" "+i.sets+"×"+i.reps).join(" · ")}</span>
 <p class="mut" style="margin:8px 0 2px;font-size:11px">Giorni previsti (ti compare in Oggi)</p>
 <div class="row seg" style="margin:0;gap:4px">${DAYS.map((d,k)=>`<button class="${(r.days||[]).includes(k)?'on':''}" style="flex:1;padding:6px 0;font-size:12px" onclick="togDay('${r.id}',${k})">${d}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><button class="p" style="flex:1" onclick="startSess('${r.id}')">Avvia</button><button onclick="rbEdit('${r.id}')">Modifica</button><button onclick="rbDup('${r.id}')">Duplica</button><button class="x" onclick="del('routines','${r.id}')">Elimina</button></div></div>`).join("")+
 `<div class="card"><b>${rb.id?'Modifica scheda':'Nuova scheda'}</b> <span class="mut">· una scheda per ogni allenamento</span><div class="row" style="margin-top:8px"><input id="bn" placeholder="Es. Petto e tricipiti" value="${esc(rb.name)}"></div>
 <label>Esercizio (aggiungine di nuovi in Registra)</label><select id="bx">${S.exercises.map(e=>`<option>${esc(e)}</option>`).join("")}</select>
 <div class="f2" style="margin-top:8px"><div><label>Serie</label><input id="bs" type="number" value="3"></div><div><label>Ripetizioni</label><input id="br" type="number" value="10"></div><div><label>Carico kg</label><input id="bw" type="number" step="0.5"></div><div><label>Riposo (secondi)</label><input id="bt" type="number" value="90"></div></div>
 <button style="width:100%" onclick="rbAdd()">+ Aggiungi alla scheda</button>
 <p class="mut" style="margin:14px 0 4px">Oppure aggiungi un’attività (corsa, nuoto, calcio…)</p>
 <div class="f2"><div><label>Sport</label><select id="bas">${Object.keys(SPORT).map(k=>`<option>${k}</option>`).join('')}</select></div><div><label>Intensità</label><select id="bai"><option value="0">Leggera</option><option value="1" selected>Media</option><option value="2">Alta</option></select></div><div><label>Minuti</label><input id="bam" type="number" inputmode="numeric" value="40"></div></div>
 <button style="width:100%" onclick="rbAddAct()">+ Aggiungi attività alla scheda</button>
 <ul>${rb.items.map((i,k)=>`<li><div>${i.act?esc(i.sport):esc(i.ex)}<br><span class="mut">${i.act?i.min+' min · intensità '+INT[i.int]:i.sets+'×'+i.reps+' · '+(i.kg||0)+' kg · riposo '+i.rest+'s'}</span></div><button class="x" onclick="rbDel(${k})">×</button></li>`).join("")}</ul>
 <button class="p" style="width:100%;margin-top:8px" onclick="rbSave()">${rb.id?'Salva modifiche':'Salva scheda'}</button>${rb.id?'<button style="width:100%;margin-top:8px" onclick="rbCancel()">Annulla modifica</button>':''}</div>`}

/* ---------- viste ---------- */
S.foods=S.foods||[];S.saved=S.saved||[];
let add=null,pick=null,res=[];

function wkSummary(){const mon=new Date();mon.setHours(12,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-7*wOff);
 const mk=m=>{const a=[];for(let j=0;j<7;j++){const d=new Date(m);d.setDate(d.getDate()+j);a.push(iso(d))}return a};
 const days=mk(mon),pm=new Date(mon);pm.setDate(pm.getDate()-7);const prev=mk(pm),today=iso(new Date()),past=days.filter(d=>d<=today);
 const logged=past.filter(d=>S.meals.some(m=>m.date===d)),n=logged.length;
 const av=f=>n?logged.reduce((t,d)=>t+f(d),0)/n:null;
 const aK=av(d=>stats(d).intake),aP=av(d=>stats(d).p),tK=av(d=>dayT(d)?dayT(d).k:0),tP=av(d=>dayT(d)?dayT(d).p:0);
 const wd=new Set(S.work.filter(x=>days.includes(x.date)).map(x=>x.date)).size,plan=days.filter(d=>S.routines.some(r=>(r.days||[]).includes(dow(d)))).length;
 const mins=S.work.filter(x=>x.act&&days.includes(x.date)).reduce((t,x)=>t+(+x.min||0),0);
 const aw=ds=>{const a=S.weights.filter(x=>ds.includes(x.date));return a.length?sum(a,'kg')/a.length:null};
 const w1=aw(days),w0=aw(prev),dw=(w1!==null&&w0!==null)?w1-w0:null;

 return `<div class="card"><div class="row" style="margin:0"><b style="flex:1">Riepilogo ${wOff?'della settimana scorsa':'di questa settimana'}</b><button onclick="wOff=${wOff?0:1};render()">${wOff?'Questa':'Scorsa'}</button></div>

/* ---------- salvataggio nel tuo account ---------- */
let DB=null,UID=null,dbReady=false,busy=false,pt=null,LW={};
const CORE=['profile','phases','exercises','routines','foods','saved','weights','meas','recent','favs','recipes'];
const setSync=t=>{const e=$('sync');if(e)e.textContent=t};
const mkey=d=>'m-'+String(d||'').slice(0,7);
function shards(){const o={core:{}};CORE.forEach(k=>o.core[k]=S[k]||(k==='profile'?{}:[]));
 ['meals','work'].forEach(k=>(S[k]||[]).forEach(x=>{const id=mkey(x.date);(o[id]=o[id]||{meals:[],work:[]})[k].push(x)}));return o}
function persist(){if(!DB||!dbReady)return;clearTimeout(pt);pt=setTimeout(flush,800)}
async function flush(){if(busy){pt=setTimeout(flush,500);return}
 busy=true;setSync('Salvataggio...');
 try{const sh=shards();
  Object.keys(LW).forEach(id=>{if(id!=='core'&&!sh[id])sh[id]={meals:[],work:[]}});
  for(const id of Object.keys(sh)){const j=JSON.stringify(sh[id]);if(LW[id]===j)continue;
   await DB.collection('data/users/'+UID).doc(id).set(sh[id]);LW[id]=j}
  setSync('Salvato nel tuo account')}
 catch(e){setSync('Salvataggio non riuscito, riprovo...');pt=setTimeout(flush,5000)}
 busy=false}
async function initDb(){
 try{
  const r=await Promise.all([claude.use('db'),claude.use('user')]);
  const db=r[0],user=r[1];if(!db||!user)return;
  const id=await user.id();if(!id)return;
  DB=db;UID=id;
  const snap=await Promise.race([DB.collection('data/users/'+UID).get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),10000))]);
  if(snap.empty){dbReady=true;
   const has=S.meals.length||S.work.length||S.weights.length||S.phases.length||(S.routines||[]).length||(S.foods||[]).length||(S.saved||[]).length;
   if(has)persist();else setSync('Salvato nel tuo account');
  }else{
   const m={meals:[],work:[]};let core=null;
   snap.docs.forEach(d=>{const x=JSON.parse(JSON.stringify(d.data()));
    if(d.id==='core'){core=x;LW.core=JSON.stringify(x)}
    else if(d.id.indexOf('m-')===0){LW[d.id]=JSON.stringify(x);m.meals.push(...(x.meals||[]));m.work.push(...(x.work||[]))}});
   if(core)Object.assign(S,core);
   S.meals=m.meals;S.work=m.work;
   dbReady=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
   setSync('Salvato nel tuo account');render()}
 }catch(e){setSync('Solo su questo telefono (account non raggiunto)')}
}
setSync('Dati salvati su questo telefono');
if(typeof claude!=='undefined'&&claude&&claude.use)initDb();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
render();
